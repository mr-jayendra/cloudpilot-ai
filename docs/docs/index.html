<h1>CloudPilot docs</h1>
<h2>Install</h2>
<pre>npm install -g cloudpilot-ai
cloudpilot --version</pre>
<h2>Update</h2>
<pre>npm install -g cloudpilot-ai@latest</pre>
<h2>Use</h2>
<pre>cloudpilot run "explain this repo"
cloudpilot tui</pre>
<p>Terminal-only. No web UI, no console login. Bring your own provider API keys via config file. Source: <a href="https://github.com/mr-jayendra/cloudpilot-ai">GitHub</a>.</p>
