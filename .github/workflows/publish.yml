name: publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.0.2)"
        required: true

# OIDC trusted publishing to npm: no tokens, nothing expires.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - run: bun install

      - run: bun ./packages/cloudpilot-ai/script/build.ts
        env:
          CLOUDPILOT_CHANNEL: latest
          CLOUDPILOT_VERSION: ${{ inputs.version }}

      - run: bun ./packages/cloudpilot-ai/script/publish.ts
        env:
          CLOUDPILOT_CHANNEL: latest
          CLOUDPILOT_VERSION: ${{ inputs.version }}
